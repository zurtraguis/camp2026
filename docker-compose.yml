# ──────────────────────────────────────────────────────────────────────────────
# Stack do Portainer — Acampamento RAIZ 2026
#
# Uso no Portainer:
#   Stacks → Add stack → "Repository" (aponte para zurtraguis/camp2026) ou cole
#   este arquivo. Preencha as variáveis na seção "Environment variables".
#   O Portainer substitui os ${...} abaixo pelos valores informados.
#
# Build: a imagem é construída a partir do Dockerfile (contexto = repo).
# Para usar uma imagem de registry, comente o bloco `build:` e descomente `image:`.
#
# Variáveis PÚBLICAS (NEXT_PUBLIC_*) precisam estar no BUILD (são inlined).
# SEGREDOS (DATABASE_URL, STRIPE_*, SUPABASE_SERVICE_ROLE_KEY, AUTH_SECRET) vão
# apenas em runtime, no bloco `environment:`.
# ──────────────────────────────────────────────────────────────────────────────

services:
  web:
    container_name: acamp2026
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://acamp2026.futagoautomacoes.com.br}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Acampamento RAIZ 2026}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PIX_KEY: ${NEXT_PUBLIC_PIX_KEY}
        NEXT_PUBLIC_PIX_RECEIVER_NAME: ${NEXT_PUBLIC_PIX_RECEIVER_NAME:-ACAMPAMENTO RAIZ}
        NEXT_PUBLIC_PIX_RECEIVER_CITY: ${NEXT_PUBLIC_PIX_RECEIVER_CITY:-Manaus}
        NEXT_PUBLIC_CONSENT_TERM_VERSION: ${NEXT_PUBLIC_CONSENT_TERM_VERSION:-v1-2026-06}
    # image: ghcr.io/zurtraguis/camp2026:latest   # alternativa: registry pré-buildado
    image: acamp2026:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      # ── Segredos / runtime (preencher no Portainer) ──
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_COMPROVANTES_BUCKET: ${SUPABASE_COMPROVANTES_BUCKET:-comprovantes}
      AUTH_SECRET: ${AUTH_SECRET}
      # NEXT_PUBLIC_* também em runtime (server components leem process.env):
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://acamp2026.futagoautomacoes.com.br}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Acampamento RAIZ 2026}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_PIX_KEY: ${NEXT_PUBLIC_PIX_KEY}
      NEXT_PUBLIC_PIX_RECEIVER_NAME: ${NEXT_PUBLIC_PIX_RECEIVER_NAME:-ACAMPAMENTO RAIZ}
      NEXT_PUBLIC_PIX_RECEIVER_CITY: ${NEXT_PUBLIC_PIX_RECEIVER_CITY:-Manaus}
      NEXT_PUBLIC_CONSENT_TERM_VERSION: ${NEXT_PUBLIC_CONSENT_TERM_VERSION:-v1-2026-06}

    # Porta direta (acesso sem proxy). Atrás do Traefik, pode remover este bloco.
    ports:
      - "${HOST_PORT:-3000}:3000"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # ── Traefik (descomente se usar o proxy do seu host; ajuste entrypoint/resolver) ──
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.acamp2026.rule=Host(`acamp2026.futagoautomacoes.com.br`)"
    #   - "traefik.http.routers.acamp2026.entrypoints=websecure"
    #   - "traefik.http.routers.acamp2026.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.acamp2026.loadbalancer.server.port=3000"
    # networks:
    #   - traefik

