# ──────────────────────────────────────────────────────────────────────────────
# Stack do Portainer (Docker Swarm) — Acampamento RAIZ 2026
#
# IMPORTANTE: o Swarm NÃO builda imagem (ignora `build:`), apenas faz `pull`.
# A imagem é construída e publicada no GHCR pelo workflow
# .github/workflows/docker-publish.yml a cada push em `main`.
#
# Pré-requisitos no host Swarm:
#   - Rede overlay externa do Traefik: `network_swarm_public` (já existe).
#   - Imagem `ghcr.io/zurtraguis/camp2026:latest` acessível (pacote GHCR público,
#     ou credenciais de registry configuradas no Portainer).
#
# Uso no Portainer:
#   Stacks → acamp → Editor: cole este arquivo (ou aponte para o repo, ref main,
#   file docker-compose.yml). Preencha os SEGREDOS em "Environment variables".
#   As NEXT_PUBLIC_* já vêm embutidas na imagem (build-time); aqui ficam só para
#   leitura server-side em runtime.
# ──────────────────────────────────────────────────────────────────────────────

services:
  web:
    image: ghcr.io/zurtraguis/camp2026:latest

    environment:
      NODE_ENV: production
      # ── Segredos / runtime (preencher no Portainer) ──
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_COMPROVANTES_BUCKET: ${SUPABASE_COMPROVANTES_BUCKET:-comprovantes}
      AUTH_SECRET: ${AUTH_SECRET}
      # NEXT_PUBLIC_* (já inlined na imagem; repetidas p/ leitura server-side):
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://acamp2026.futagoautomacoes.com.br}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Acampamento RAIZ 2026}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_PIX_KEY: ${NEXT_PUBLIC_PIX_KEY}
      NEXT_PUBLIC_PIX_RECEIVER_NAME: ${NEXT_PUBLIC_PIX_RECEIVER_NAME:-ACAMPAMENTO RAIZ}
      NEXT_PUBLIC_PIX_RECEIVER_CITY: ${NEXT_PUBLIC_PIX_RECEIVER_CITY:-Manaus}
      NEXT_PUBLIC_CONSENT_TERM_VERSION: ${NEXT_PUBLIC_CONSENT_TERM_VERSION:-v1-2026-06}

    networks:
      - network_swarm_public

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        order: start-first
        failure_action: rollback
      # Labels Traefik DEVEM ficar em deploy.labels no Swarm (provider Swarm lê
      # labels do serviço, não do container). Valores confirmados contra o
      # Traefik do host: provider network=network_swarm_public, entrypoint
      # websecure (:443), certresolver=letsencryptresolver. O redirect HTTP→HTTPS
      # já é feito globalmente por um router `http-catchall` no Traefik, então
      # NÃO declaramos router no entrypoint `web` aqui (evita duplicação).
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.acamp.rule=Host(`acamp2026.futagoautomacoes.com.br`)"
        - "traefik.http.routers.acamp.entrypoints=websecure"
        - "traefik.http.routers.acamp.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.acamp.loadbalancer.server.port=3000"

# Rede pública do Traefik — criada fora desta stack.
networks:
  network_swarm_public:
    external: true
